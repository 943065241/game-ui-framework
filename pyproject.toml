[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipg-framework"
version = "1.1.0b1"
description = "Local-first AI production and governance framework with GUIF as its visual-production domain"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "AIPG Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0", "build>=1.2"]
image = ["Pillow>=10.0"]

[project.scripts]
guif = "guif.cli:main"
aipg = "guif.cli:main"
guif-ops = "guif.ops_cli:main"
guif-gateway = "guif.gateway_cli:main"
guif-ledger = "guif.ledger_cli:main"
guif-conversation = "guif.conversation_cli:main"
guif-ready = "guif.readiness_cli:main"

[tool.setuptools.packages.find]
include = ["aipg*", "guif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
