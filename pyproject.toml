[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-ui-framework"
version = "1.0.0a18"
description = "Local-first, AI-agnostic game UI production framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GUIF Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0"]
image = ["Pillow>=10.0"]

[project.scripts]
guif = "guif.cli:main"

[tool.setuptools.packages.find]
include = ["guif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
