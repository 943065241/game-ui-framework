[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-ui-framework"
version = "1.0.0b2"
description = "Local-first game UI production framework with a frozen conversation MVP, hash provenance, private backup protection boundary, upgrade assurance, and production hardening controls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GUIF Contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0", "build>=1.2"]
image = ["Pillow>=10.0"]

[project.scripts]
guif = "guif.cli:main"
guif-ops = "guif.ops_cli:main"
guif-gateway = "guif.gateway_cli:main"
guif-ledger = "guif.ledger_cli:main"
guif-conversation = "guif.conversation_cli:main"
guif-ready = "guif.readiness_cli:main"

[tool.setuptools.packages.find]
include = ["guif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
