name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test without Pillow deprecation warnings
        run: pytest -q -W error::DeprecationWarning:PIL
      - name: Build wheel and source distribution
        run: python -m build
      - name: Generate and verify hash provenance
        run: |
          guif-ready provenance --dist dist --git-commit "${{ github.sha }}"
          guif-ready provenance --dist dist --git-commit "${{ github.sha }}" --verify
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import guif; assert guif.__version__ == '1.0.0b2'"
      - name: CLI contract smoke test
        run: guif-ready contract > /dev/null
